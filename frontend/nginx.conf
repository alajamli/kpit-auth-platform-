# Template nginx : les variables ${PORT}, ${BACKEND_URL} et ${NGINX_RESOLVER}
# sont substituées au démarrage du conteneur (entrypoint officiel nginx).
# Valeurs par défaut (docker compose) définies dans le Dockerfile.
server {
    listen ${PORT};
    server_name _;

    # DNS interne : Docker (127.0.0.11) ou Railway ([fd12::10])
    resolver ${NGINX_RESOLVER} valid=10s;

    # Serve Angular Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests directly to Flask Backend
    location /api/ {
        # Variable => résolution DNS à chaque requête (le backend peut démarrer après nginx)
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
    }
}
